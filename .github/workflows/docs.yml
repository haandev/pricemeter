name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**"
      - "examples/**"
      - "design/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install
      # the code shown on the site (docs/src/snippets) must run and type-check
      - run: bun run --cwd docs test
      # typedoc API, Pagefind search and starlight-links-validator (fails on broken links)
      - run: bun run --cwd docs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
